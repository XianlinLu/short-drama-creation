name: short-drama-creation
version: 3.4.0
mode: lumina-canvas
language: auto
summary: 自动匹配用户语言，支持原创短剧、角色资产、试音、逐场分镜视频和连续延长。

runtime:
  platform: Lumina Canvas Agent
  system_instructions: LUMINA_SYSTEM_INSTRUCTIONS.md
  task_input: Task Prompt or connected String input
  output: localized Agent response and connected action artifacts
  action_policy:
    - use_only_connected_actions
    - never_fabricate_artifacts_or_metadata
    - preserve_successful_upstream_results
  optional_actions:
    - native single-choice user input
    - public-source research
    - multimodal character reference
    - reference-aware image generation
    - image-to-video generation
    - true full-video extension
    - returned video duration metadata
    - original music generation
    - TTS and sound effects
    - single-video audio mux
    - subtitles, preview, and save

triggers:
  include:
    - 原创短剧
    - 小说创作
    - 故事构思
    - 故事改写
    - 故事续写
    - 开篇钩子
    - 冲突升级
    - 对白张力
    - 人物三视图
    - 角色三视图
    - 分镜场景图
    - 分镜视频
    - 视频延长
    - 指定视频时长
    - 自动背景音乐
    - 配音重试
    - 视频版权风控
    - 视频生成 23007
    - OutputVideoSensitiveContentDetected
    - 音频版权风控
    - OutputAudioSensitiveContentDetected
    - 智能画面比例
    - InvalidParameter.TaskTypeConstraint
    - 制作分镜表
    - 角色资产图
    - 角色试音
    - 场景对白
    - original short drama
    - fiction writing
    - story revision
    - character turnaround
    - storyboard video
    - extend video
    - target duration
    - background music
    - TTS recovery
    - video copyright policy error
    - audio copyright policy error
    - smart aspect ratio
    - storyboard production
    - character asset sheet
    - voice audition
    - オリジナル短編
    - 小説作成
    - キャラクター三面図
    - 絵コンテ動画
    - 動画延長
  exclude:
    - 新闻报道
    - 学术论文
    - 纯非虚构写作

inputs:
  required:
    - user_request
  optional:
    - interaction_language
    - story_language
    - premise
    - synopsis
    - existing_draft
    - character_turnaround_image
    - selected_topic_direction
    - target_duration
    - aspect_ratio
    - audience
    - genre
    - emotional_payoff
    - forbidden_elements
    - reference_signals
    - research_request
    - speech_preference
    - music_preference
    - video_generation_error
    - confirmed_screenplay
    - storyboard_next_step_selected
    - character_asset_feedback
    - character_voice_feedback
    - scene_video_feedback

outputs:
  story:
    - native_topic_card_when_direction_is_open
    - attraction_strategy_when_planning_is_needed
    - outline_when_planning_is_needed
    - complete_original_story
    - optional_quality_note
  character_video:
    - native_topic_card_before_media
    - selected_direction_and_locked_duration
    - continuity_plan
    - initial_storyboard
    - short_initial_video
    - sequential_full_video_extensions
    - original_background_music
    - optional_verified_speech
    - duration_verified_final_video
    - localized_delivery_summary
    - copyright_recovery_summary_when_needed
  storyboard_production:
    - final_screenplay_character_registry
    - one_16_9_four_view_asset_sheet_per_character
    - character_asset_confirmation_checkpoint
    - one_20_to_30_second_audition_per_character
    - character_voice_confirmation_checkpoint
    - scene_storyboard_table
    - confirmed_voice_dialogue_audio
    - scene_video
    - per_scene_confirmation_checkpoint
    - dependency_version_summary

constraints:
  - choose_one_primary_route_per_run
  - visible_workflow_uses_latest_direct_request_language
  - every_visible_template_is_localized
  - story_language_is_resolved_separately
  - every_direction_choice_uses_one_native_single_choice_card
  - direction_card_has_exactly_four_options_with_recommended_first
  - direction_card_uses_native_other_and_submit
  - direction_action_ends_current_execution
  - missing_direction_action_has_no_text_fallback
  - character_video_requires_reference_and_visual_request
  - topic_selection_precedes_all_media
  - storyboard_route_requires_confirmed_screenplay_and_selected_next_step
  - all_assets_confirm_before_auditions
  - all_voices_confirm_before_scene_media
  - scene_video_stops_for_confirmation_before_next_scene
  - characterless_script_skips_character_assets_and_auditions
  - changed_character_asset_or_voice_invalidates_dependent_outputs
  - target_duration_is_explicit
  - initial_video_is_followed_by_true_extensions
  - initial_ratio_uses_smart_supported_selection
  - actual_initial_video_ratio_is_locked_as_metadata
  - every_extension_omits_ratio_parameter
  - invalid_extension_ratio_retries_only_failed_step_without_ratio
  - every_extension_uses_latest_complete_video
  - video_copyright_policy_rejection_uses_bounded_originalization
  - recognizable_third_party_reference_requires_original_replacement
  - failed_video_step_retries_without_restarting_verified_work
  - policy_recovery_never_obfuscates_or_provider_hops
  - audio_output_copyright_error_is_not_tts_text_risk
  - audio_copyright_recovery_preserves_video_and_successful_chunks
  - audio_policy_recovery_never_pitch_shifts_slices_or_provider_hops
  - independent_clips_are_not_concatenated
  - every_video_prompt_starts_at_zero
  - cumulative_timecodes_do_not_enter_video_prompts
  - music_is_original_and_matches_final_duration
  - rejected_tts_chunk_is_recovered_in_isolation
  - completed_outputs_are_preserved
  - missing_required_media_action_stops_without_fabrication
  - only_real_action_results_are_delivered
  - all_import_documents_are_supported_text_under_20000_characters

resources:
  language_and_topic_ui: references/interaction-and-topic-ui.md
  story: references/story-workflow.md
  storyboard_production: references/storyboard-production-workflow.md
  video: references/continuous-video-workflow.md
  aspect_ratio: references/aspect-ratio-routing.md
  video_copyright_recovery: references/video-copyright-recovery.md
  audio: references/audio-and-tts.md
  audio_copyright_recovery: references/audio-copyright-recovery.md
  originality_and_quality: references/originality-and-quality.md
  validation: references/package-validation.md
