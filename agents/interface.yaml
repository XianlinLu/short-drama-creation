name: lumina-novel-generator
version: 1.2.0
mode: lumina-canvas
language: auto
summary: 自动匹配用户语言的原创小说工作流，以及角色三视图到约一分钟成片的视觉 Demo 工作流。

runtime:
  platform: Lumina Canvas Agent
  system_instructions: LUMINA_SYSTEM_INSTRUCTIONS.md
  task_input: Task Prompt or an @-referenced String input
  output: Agent text output
  language_policy:
    interaction: auto-detect from latest direct user request
    story: explicit request, otherwise preserve revised draft, otherwise interaction language
    visible_process: interaction language
    detection_excludes: quoted, attached, retrieved, pasted, code, metadata, and tool-output content
  optional_tools:
    - connected public-source research component
    - connected character-reference or multimodal input
    - connected reference-aware image generation component
    - connected image-to-video or first-last-frame video component
    - connected ordered video composition or concatenation component
    - connected last-frame, audio, subtitle, preview, or save component
  constraints:
    - only_connected_components_are_available
    - prewrite_confirmation_requires_a_follow_up_run
    - import_package_uses_supported_text_formats_only
    - visible_process_uses_detected_interaction_language
    - story_language_is_selected_separately
    - character_video_demo_requires_reference_image_and_visual_request
    - character_video_demo_stops_for_topic_choice_before_generation
    - media_generation_uses_actual_connected_component_contracts

triggers:
  include:
    - 小说
    - 短篇小说
    - 故事
    - 网文样章
    - 开篇钩子
    - 开篇误读
    - 看不懂
    - 爽点
    - 爽文
    - 情绪刺激
    - 剧情套路
    - 情节引擎
    - 经典桥段
    - 桥段重构
    - 电影桥段
    - 联网搜
    - 搜索参考
    - 先搜
    - 参考作品
    - 模仿风格
    - 马伯庸
    - 食神
    - 悬念改写
    - 人物欲望
    - 冲突升级
    - 对白张力
    - 结尾余味
    - 续写
    - 改写
    - 完整短篇
    - 作家组合
    - 叙事技法
    - novel
    - fiction
    - short story
    - story outline
    - opening hook
    - rewrite this story
    - suspense story
    - 小説
    - 短編小説
    - 物語
    - ストーリー
    - プロット
    - 書き直し
    - 冒頭のフック
    - サスペンス
    - 人物三视图
    - 角色三视图
    - 三视图分镜
    - 分镜场景图
    - 分镜视频
    - 一分钟短片
    - 角色视频 demo
    - character turnaround
    - character three-view
    - storyboard images
    - storyboard video
    - one-minute character film
    - キャラクター三面図
    - 絵コンテ
    - 一分動画
  exclude:
    - 纯短剧剧本
    - 电影剧本格式
    - 非虚构书口播
    - 新闻报道
    - 学术论文

inputs:
  required:
    - user_request
  optional:
    - theme
    - character_setup
    - synopsis
    - existing_fragment
    - desired_genre
    - length
    - author_signals
    - classic_inspirations
    - forbidden_elements
    - target_reader
    - emotional_payoff
    - story_engines
    - conflict_arena
    - interaction_language
    - story_language
    - character_turnaround_image
    - selected_topic_direction
    - target_aspect_ratio
    - target_duration_seconds
    - audio_mode

outputs:
  default:
    type: prewrite_then_complete_short_story
    sections:
      - story_options_if_vague
      - attraction_strategy
      - outline
      - title
      - story_body
  sample_or_review:
    type: story_with_self_evaluation
    sections:
      - input
      - technique_mix
      - story_body
      - seven_part_self_evaluation
  character_video_demo:
    type: topic_gated_storyboard_video_and_final_film
    sections:
      - four_topic_directions
      - selected_topic_and_timeline
      - six_shot_storyboard
      - six_short_videos
      - thirty_second_act_a
      - thirty_second_act_b
      - approximately_sixty_second_final_film
      - delivery_and_deviation_summary

quality_gates:
  - intent_hook_selected
  - interaction_language_detected_from_latest_direct_request
  - quoted_and_attached_content_ignored_for_language_detection
  - visible_process_language_consistent
  - story_language_selected_separately
  - fixed_templates_localized
  - inspiration_remix_options_offered
  - classic_beats_translated_not_copied
  - emotional_payoff_selected
  - story_engine_library_loaded
  - vague_request_gets_numbered_choices
  - attraction_strategy_and_outline_discussed_before_draft
  - genre_rubric_loaded
  - first_three_paragraphs_have_disturbance
  - protagonist_has_visible_desire
  - conflict_escalates_at_least_three_times
  - scenes_reveal_new_information_or_cost
  - dialogue_contains_subtext_or_pressure
  - imagery_is_concrete_not_decorative
  - ending_reframes_opening
  - opening_semantic_clarity_gate_passed
  - anti_ai_language_gate_passed
  - lumina_connected_tool_boundary_respected
  - prewrite_stop_point_respected
  - feedback_classified_before_rewrite
  - transferable_rules_not_one_off_content
  - no_author_style_imitation
  - no_copyrighted_scene_copy
  - character_video_mode_requires_three_view_and_visual_intent
  - four_topic_directions_returned_before_media_generation
  - topic_choice_stop_point_respected
  - original_micro_story_created_after_selection
  - connected_duration_limits_inspected
  - no_single_thirty_second_generation_assumed
  - default_six_ten_second_shot_timeline_when_supported
  - original_character_reference_used_for_every_storyboard
  - storyboard_and_video_outputs_are_actual_tool_results
  - adjacent_shot_continuity_checked
  - act_a_and_act_b_each_approximately_thirty_seconds
  - final_film_approximately_fifty_eight_to_sixty_two_seconds
  - composition_uses_ordered_successful_clips_only
  - missing_media_capability_reported_without_fabrication

resources:
  skill: SKILL.md
  technique_matrix: references/technique-matrix.md
  inspiration_remix_playbook: references/inspiration-remix-playbook.md
  source_research_remix: references/source-research-remix.md
  story_engine_library: references/story-engine-library.md
  prewrite_interview: references/prewrite-interview.md
  output_contract: references/output-contract.md
  anti_ai_language: references/anti-ai-language.md
  language_routing: references/language-routing.md
  character_video_demo: references/character-video-demo.md
  quality_checklist: references/quality-checklist.md
  genre_quality_rubric: references/genre-quality-rubric.md
  evolution_loop: references/evolution-loop.md
  sample_wuxia_suspense: examples/sample-01-wuxia-suspense.md
  sample_sci_fi_memory: examples/sample-02-sci-fi-memory.md
  repository_validation: references/repository-validation.md
  lumina_system_instructions: LUMINA_SYSTEM_INSTRUCTIONS.md
